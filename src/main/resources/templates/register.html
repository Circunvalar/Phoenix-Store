<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar - Phoenix Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
        }
        header {
            font: 400 25px/1.5 'Ubuntu', sans-serif;
            width: 97.9%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ff6600;
            padding: 15px 20px;
            color: white;
        }
        .header-left {
            font-size: 36px;
            font-weight: bold;
            padding: 5px 20px;
        }
        .register-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            margin-top: 50px;
            text-align: center;
        }
        .register-container input {
            font: 400 25px/1.5 'Ubuntu', sans-serif;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .register-container button {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        .error-message {
            color: #bd0707;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">Phoenix Store</div>
</header>
<div class="register-container">
    <form th:action="@{/register}" method="post" th:object="${usuario}">
        <input type="hidden" th:field="*{usuid}" />

        <label for="usuusername">Username:</label><br>
        <input type="text" id="usuusername" th:field="*{usuusername}" required><br>
        <div class="error-message" th:if="${#fields.hasErrors('usuusername')}" th:errors="*{usuusername}"></div>

        <label for="usucontrasena">Contraseña:</label><br>
        <input type="password" id="usucontrasena" th:field="*{usucontrasena}" required><br>
        <div class="error-message" th:if="${#fields.hasErrors('usucontrasena')}" th:errors="*{usucontrasena}"></div>

        <label for="usunombres">Nombres:</label><br>
        <input type="text" id="usunombres" th:field="*{usunombres}" required><br>
        <div class="error-message" th:if="${#fields.hasErrors('usunombres')}" th:errors="*{usunombres}"></div>

        <label for="usuapellidos">Apellidos:</label><br>
        <input type="text" id="usuapellidos" th:field="*{usuapellidos}" required><br>
        <div class="error-message" th:if="${#fields.hasErrors('usuapellidos')}" th:errors="*{usuapellidos}"></div>

        <label for="usucedula">Cédula:</label><br>
        <input type="number" id="usucedula" th:field="*{usucedula}" required><br>
        <div class="error-message" th:if="${#fields.hasErrors('usucedula')}" th:errors="*{usucedula}"></div>

        <label for="usucorreo">Correo:</label><br>
        <input type="email" id="usucorreo" th:field="*{usucorreo}" required><br>
        <div class="error-message" th:if="${#fields.hasErrors('usucorreo')}" th:errors="*{usucorreo}"></div>

        <label for="usutelefono">Teléfono:</label><br>
        <input type="text" id="usutelefono" th:field="*{usutelefono}" required><br>
        <div class="error-message" th:if="${#fields.hasErrors('usutelefono')}" th:errors="*{usutelefono}"></div>

        <label for="usudireccion">Dirección:</label><br>
        <input type="text" id="usudireccion" th:field="*{usudireccion}" required><br>
        <div class="error-message" th:if="${#fields.hasErrors('usudireccion')}" th:errors="*{usudireccion}"></div>

        <label for="usurol">Rol:</label><br>
        <input type="text" id="usurol" th:field="*{usurol}" required><br>
        <div class="error-message" th:if="${#fields.hasErrors('usurol')}" th:errors="*{usurol}"></div>

        <br>
        <button type="submit">Registrar</button>
    </form>

    <div class="error-message" th:if="${error}">
        <span th:text="${error}"></span>
    </div>
</div>
</body>
</html>
