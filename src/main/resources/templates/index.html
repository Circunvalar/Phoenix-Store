<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
        }
        header {
            font: 400 25px/1.5 'Ubuntu', sans-serif;
            width: 97.9%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ff6600;
            padding: 15px 20px;
            color: white;
        }
        .header-left {
            font-size: 36px;
            font-weight: bold;
            padding: 5px 20px;
        }
        .header-right button {
            font: 400 25px/1.5 'Ubuntu', sans-serif;
            background-color: white;
            color: #ff6600;
            border: none;
            padding: 12px 10px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        .search-container {
            margin: 2px;
            width: 60%;
            display: flex;
            justify-content: center;
        }
        .search-container input {
            font: 400 25px/1.5 'Ubuntu', sans-serif;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 80%;
            margin-top: 20px;
        }
        .product {
            background-color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 200px;
        }
        .product img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .product p {
            margin: 10px 0 5px;
            font-size: 16px;
        }
        .product button {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">Phoenix Store</div>
    <div class="search-container">
        <label>
            <input type="text" placeholder="Buscar productos...">
        </label>
    </div>
    <div class="header-right">
        <form action="/login" method="get">
            <button type="submit">Iniciar Sesión</button>
        </form>
    </div>
</header>
<div class="products">
    <div class="product" th:each="producto : ${productos}">
        <img th:src="${producto.proimagenUrl}" th:alt="${producto.pronombre}" />
        <p th:text="${producto.pronombre}">Nombre del producto</p>
        <p><strong>$</strong><span th:text="${producto.proprecio}">0.0</span></p>
        <button>Añadir al carrito</button>
    </div>
</div>

</body>
</html>
