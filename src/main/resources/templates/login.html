<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio sesión - Phoenix Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
        }
        header {
            font: 400 25px/1.5 'Ubuntu', sans-serif;
            width: 97.9%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ff6600;
            padding: 15px 20px;
            color: white;
        }
        .header-left {
            font-size: 36px;
            font-weight: bold;
            padding: 5px 20px;
        }
        .header-right button {
            font: 400 25px/1.5 'Ubuntu', sans-serif;
            background-color: white;
            color: #ff6600;
            border: none;
            padding: 12px 10px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }
        .login-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            margin-top: 50px;
            text-align: center;
        }
        .login-container input {
            font: 400 25px/1.5 'Ubuntu', sans-serif;
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .login-container button {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        .error-message {
            color: #bd0707;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">Phoenix Store</div>
</header>
<div class="login-container">
    <form action="/login" method="post">
        <label for="usu_username">Username:</label><br>
        <input type="text" id="usu_username" name="usu_username" required><br>
        <label for="usu_contrasena">Contraseña:</label><br>
        <input type="password" id="usu_contrasena" name="usu_contrasena" required><br><br>
        <button type="submit">Iniciar sesión</button><br><br>
        <label>¿No tienes cuenta?</label><br>
        <button type="button" onclick="window.location.href='/register'">Registrar</button>
    </form>
    <div class="error-message">
        <span th:text="${error}"></span>
    </div>
</div>
</body>
</html>
